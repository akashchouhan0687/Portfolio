<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Fill the {{TOKENS}} (the compliance gate fails on any left over):
        TITLE        — product name + one-line hook, ≤60 chars
        DESCRIPTION  — ≤155 chars
        CANONICAL    — public origin, no trailing slash (from get-public-url.py)
        THEME_COLOR  — hex matching --color-canvas in src/index.css
      Sites: also drop public/og-image.jpg (1200x630). Apps: og-image optional.
    -->
    <title>Akash Chouhan — Full-Stack Developer</title>
    <meta name="description" content="Portfolio of Akash Chouhan, a developer building fast, thoughtful web products. Selected work, toolbox and contact." />
    <meta name="theme-color" content="#f7f4ec" />
    <link rel="canonical" href="https://example.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Akash Chouhan — Full-Stack Developer" />
    <meta property="og:description" content="Portfolio of Akash Chouhan, a developer building fast, thoughtful web products. Selected work, toolbox and contact." />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:image" content="https://example.com/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Akash Chouhan — Full-Stack Developer" />
    <meta name="twitter:description" content="Portfolio of Akash Chouhan, a developer building fast, thoughtful web products. Selected work, toolbox and contact." />
    <meta name="twitter:image" content="https://example.com/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.bunny.net" /><link href="https://fonts.bunny.net/css?family=cabinet-grotesk:700,800|satoshi:400,500,700|jetbrains-mono:400,500&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
